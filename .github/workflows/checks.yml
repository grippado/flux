# Roda os checks de contrato do repo em toda PR e em todo push para a main.
#
# Os dois primeiros scripts abaixo cobrem pontos cegos do `claude plugin
# validate`, que valida cada manifesto isoladamente e nunca a relação entre eles
# nem o texto dos shared/. Até aqui eles só rodavam quando o autor lembrava de
# rodá-los na mão, o que degrada para zero na primeira contribuição de terceiro.
#
# check-manifests.sh   — version e name iguais nos cinco manifests.
# check-codex-agent-contract.sh — as frases que sustentam o adaptador Codex
#   continuam nos shared/. É um canário anti-deleção, não uma prova das
#   invariantes: apagar a seção falha, reescrevê-la preservando a regra também
#   falha, e inverter a regra mantendo a frase passa. Está em CI justamente
#   porque um canário que ninguém executa não avisa nada.
#
# test-run.sh e `bun test` (cli/) cobrem o writer do run e a CLI, inclusive a
# paridade entre VERB_REQUIREMENTS e o requires: do SKILL do review.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Checks de contrato
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: check-manifests
        run: scripts/check-manifests.sh

      - name: check-codex-agent-contract
        run: scripts/check-codex-agent-contract.sh

      - name: shellcheck
        run: shellcheck plugins/flux/scripts/run.sh scripts/test-run.sh

      - name: awk do runner
        run: (awk --version 2>/dev/null || awk -W version 2>&1) | head -1

      - name: test-run
        run: scripts/test-run.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: cli tests
        working-directory: cli
        run: bun test

      # Aviso, nunca falha: manifests bumpados sem tag ficam invisiveis ate alguem
      # notar. O 1.29.1 ficou dias nos manifests sem release. Em PR o bump ainda
      # nao tem tag por definicao, entao o aviso so faz sentido no push para main.
      #
      # Logo depois do merge de um bump este aviso e esperado: a tag so nasce
      # quando a run do workflow release e aprovada. Ele vira problema quando
      # continua aparecendo nos pushes seguintes.
      - name: manifest-vs-tag
        if: github.event_name == 'push'
        run: |
          git fetch --tags --quiet
          manifest="$(jq -r '.version' plugins/flux/.claude-plugin/plugin.json)"
          tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "manifests em ${manifest}; ultima tag ${tag:-nenhuma}"
          if [ "v${manifest}" != "${tag}" ]; then
            echo "::warning title=release pendente::a versao dos manifests e ${manifest} mas a ultima tag e ${tag:-nenhuma}. A tag nasce quando a run do workflow release e aprovada: gh run list --workflow release. Sem run pendente, ver Publicar uma versao no README."
          fi
